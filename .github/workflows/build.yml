name: Byg Mac-app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node tools/unpack-assets.js && node tools/make-remote.js
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Byg app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac zip --arm64 --publish never || true
      - name: Signér (ad hoc) og pak
        run: |
          test -d dist/mac-arm64/LightLink.app
          codesign --force --deep -s - dist/mac-arm64/LightLink.app
          cd dist/mac-arm64 && ditto -c -k --sequesterRsrc --keepParent LightLink.app ../../LightLink-Mac.zip
      - name: Udgiv release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: LightLink ${{ steps.v.outputs.version }}
          body: ${{ github.event.head_commit.message }}
          files: LightLink-Mac.zip
