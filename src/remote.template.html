<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LightLink">
<meta name="theme-color" content="#050505">
<link rel="apple-touch-icon" href="/touch-icon.png">
<link rel="manifest" id="manifest" href="/manifest.json">
<title>LightLink</title>
<style>
:root { --bg:#07080c; --panel:#0e1016; --panel2:#161a23; --line:#222838; --text:#eef1f6; --muted:#8a93a6; --accent:#31f3ac; --accent2:#4f8cff; --dim:rgba(49,243,172,.13); --warn:#ff3b5c; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  -webkit-user-select: none; user-select: none; overscroll-behavior: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; height: 50px; padding: 0 12px; font-size: 16px; }
button:active { transform: scale(.97); }
.app { display: flex; flex-direction: column; height: 100%; padding-top: env(safe-area-inset-top); }
header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex: none; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 300; letter-spacing: .28em; font-size: 13px; }
.brand b { font-weight: 700; }
.brand img { width: 24px; height: 24px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); margin-left: auto; flex: none; }
.dot.ok { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.bo { height: 44px; min-width: 150px; font-weight: 800; letter-spacing: .04em; font-size: 13px; border-color: #3fd46b; color: #04130a; background: #3fd46b; box-shadow: 0 0 16px rgba(63,212,107,.45); }
.bo.on { background: #ff3b5c; border-color: #ff3b5c; color: #fff; box-shadow: 0 0 16px rgba(255,59,92,.45); }
.lightbar { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); flex: none; }
.lighthead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.lighthead span { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.lighthead b { font-size: 26px; font-variant-numeric: tabular-nums; color: var(--accent); }
.lighthead b.hot { color: #ff8a3c; }
.hfader { position: relative; height: 46px; border-radius: 12px; background: #000; border: 1px solid var(--line); overflow: hidden; touch-action: none; }
.hfader .fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
.hfader .fill.hot { background: linear-gradient(90deg, #8a6a10, #ffb02e 70%, #ff6b3c); }
.hfader .knob { position: absolute; top: 4px; bottom: 4px; width: 10px; margin-left: -5px; border-radius: 4px; background: #fff; box-shadow: 0 0 10px rgba(0,0,0,.6); }
.hfader .cap { position: absolute; top: 0; bottom: 0; border-left: 2px dashed var(--warn); }
.hfader .dz { position: absolute; top: 0; bottom: 0; right: 0; border-left: 2px solid #ff3b5c; background: repeating-linear-gradient(135deg, rgba(255,59,92,.28) 0 4px, rgba(255,59,92,.08) 4px 8px); pointer-events: none; }
.hfader .dz i { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 16px; opacity: .85; }
.hfader.danger .knob { background: #fff; outline: 2px solid #ff3b5c; box-shadow: 0 0 12px rgba(255,59,92,.9); }
.hfader.danger2 .dz i { animation: eye .9s ease-in-out infinite; }
@keyframes eye { 0%,100% { opacity: .5; } 50% { opacity: 1; transform: translateY(-50%) scale(1.3); } }
.vb { position: relative; display: grid; grid-template-columns: 1fr auto; row-gap: 6px; align-items: center; user-select: none; margin-top: 12px; }
.vb-l { font-size: 12px; color: var(--muted); } .vb-v { font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
.vb-bar { grid-column: 1 / 3; position: relative; height: 40px; border-radius: 10px; background: #000; border: 1px solid var(--line); overflow: hidden; touch-action: none; }
.vb-bar::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.05) calc(10% - 1px) 10%); }
.vb-fill { position: absolute; top: 0; bottom: 0; left: 0; background: linear-gradient(90deg, var(--accent2), var(--accent)); opacity: .85; }
.zonebar .vb-fill { background: linear-gradient(90deg, #7a1f2e, #ff3b5c); }
.vb-knob { position: absolute; top: 4px; bottom: 4px; width: 4px; margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 8px rgba(0,0,0,.8); }
.calbtn { margin-top: 14px; height: 44px; } .calbtn.on { border-color: #ff3b5c; color: #ff8a9c; }
.calrow { grid-template-columns: 1fr 1fr 1fr; margin-top: 12px; } .calrow2 { grid-template-columns: 1fr 1fr; margin-top: 8px; } .calsteps { grid-template-columns: repeat(4, 1fr); margin-top: 10px; } .calsteps button { font-size: 11px; height: 40px; } .calsteps button.on { border-color: #ff3b5c; color: #ff8a9c; background: rgba(255,59,92,.15); } .calrow button.on { border-color: var(--accent); color: var(--accent); }
#mZoneLaser.on { border-color: #ff3b5c; color: #ff8a9c; background: rgba(255,59,92,.15); }
.dangernote { margin: 8px 0 0; font-size: 11px; color: #ff8a9c; min-height: 14px; }
.presets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
.presets button { height: 40px; font-size: 15px; font-variant-numeric: tabular-nums; }
.presets button.on { border-color: var(--accent); color: var(--accent); background: var(--dim); }
main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px; }
.page { display: none; }
.page.on { display: block; }
h2 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 4px 0 10px; font-weight: 600; }
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.pat { position: relative; aspect-ratio: 1; background: #000; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 17px; }
.pat canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pat.has .n { position: absolute; top: 3px; left: 6px; font-size: 10px; color: #bbb; font-weight: 600; }
.pat .nm { position: absolute; bottom: 3px; left: 4px; right: 4px; font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.pat.on { border-color: var(--accent); box-shadow: 0 0 12px rgba(49,243,172,.3); }
.pages { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; }
.pages button { height: 32px; font-size: 13px; flex: none; }
.pages button.on, .seg button.on { border-color: var(--accent); color: var(--accent); background: var(--dim); }
.sw { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sw button { height: 52px; border: 2px solid transparent; font-size: 12px; font-weight: 700; }
.sw button.on { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,.4); }
.sw .orig { background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red); color: #fff; text-shadow: 0 1px 2px #000; }
.row { display: flex; gap: 10px; align-items: center; margin: 12px 0; }
.toggle { flex: 1; }
.toggle.on { border-color: var(--accent); color: var(--accent); background: var(--dim); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin-bottom: 14px; }
.seg button { height: 40px; font-size: 13px; padding: 0 4px; }
.sl { display: grid; grid-template-columns: 96px 1fr 46px; align-items: center; gap: 10px; height: 56px; color: var(--muted); font-size: 14px; }
.sl output { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; font-size: 13px; }
input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; background: var(--line); border-radius: 3px; width: 100%; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 4px solid var(--panel); box-shadow: 0 0 0 1px #555; }
.bpm { display: flex; align-items: center; gap: 14px; margin: 6px 0 14px; }
.bpm b { font-size: 44px; font-variant-numeric: tabular-nums; }
.bpm small { color: var(--muted); font-weight: 700; }
.tap { width: 100%; height: 150px; font-size: 32px; font-weight: 900; letter-spacing: .2em; border-radius: 16px; }
.tap.hit { background: var(--dim); border-color: var(--accent); }
.info { background: var(--dim); border: 1px solid rgba(49,243,172,.3); border-radius: 10px; padding: 12px; font-size: 13px; margin-bottom: 14px; }
.scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.scenes button { height: 76px; font-size: 16px; font-weight: 600; }
.scenes button.empty { opacity: .3; border-style: dashed; }
.scenes button.on { border-color: var(--accent); color: var(--accent); background: var(--dim); }
nav { display: grid; grid-template-columns: repeat(6, 1fr); border-top: 1px solid var(--line); background: #000; flex: none; padding-bottom: env(safe-area-inset-bottom); }
nav button { border: 0; background: none; height: 62px; border-radius: 0; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
nav button i { font-style: normal; font-size: 18px; }
nav button.on { color: var(--accent); }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; z-index: 5; }
.overlay[hidden] { display: none; }
.overlay p { color: var(--muted); }
.overlay.arm { background: rgba(0,0,0,.85); align-items: flex-end; padding: 0; }
.armbox { background: var(--panel); border-top: 2px solid var(--warn); border-radius: 18px 18px 0 0; padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); width: 100%; text-align: left; }
.armbox h2 { color: #ff8a9c; font-size: 18px; letter-spacing: 0; text-transform: none; margin: 0 0 8px; }
.armbox p { color: var(--text); margin: 0 0 16px; line-height: 1.45; }
.armchk { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 16px; }
.armchk input { width: 24px; height: 24px; accent-color: var(--accent); }
.armrow { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.armrow .go { background: #3fd46b; border-color: #3fd46b; color: #04130a; font-weight: 800; }
.armrow .go:disabled { opacity: .35; }
.hint { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
.mlive { position: relative; aspect-ratio: 1 / 1; background: #000; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); touch-action: none; margin-bottom: 10px; }
#mpv { width: 100%; height: 100%; display: block; }
.mlab { position: absolute; top: 8px; left: 10px; font-size: 10px; letter-spacing: .2em; color: var(--accent); font-weight: 700; }
.mpvinfo { position: absolute; bottom: 8px; left: 10px; right: 10px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtools { grid-template-columns: 1fr 1fr 1fr 1fr; margin-bottom: 8px; }
.mtools button { height: 44px; font-size: 13px; }
.mtools button.on { border-color: var(--accent); color: var(--accent); background: var(--dim); }
#mZone.on { border-color: var(--warn); color: #ff8a9c; background: rgba(255,59,92,.15); }
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
#homeScenes { margin-bottom: 18px; }
#homeScenes button { height: 64px; }
.home-btn { height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.home-btn i { font-style: normal; font-size: 26px; }
.home-btn b { font-size: 15px; }
.home-btn small { font-size: 11px; color: var(--muted); }
.home-btn.on { border-color: var(--accent); background: var(--dim); }
.home-btn.on small { color: var(--accent); }
.musicbig { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 0 0 10px; }
.seg.autos { grid-auto-flow: row; grid-template-columns: 1fr 1fr 1fr; margin: 14px 0; }
.seg.autos button { height: 56px; font-size: 16px; }
.musicbig div { height: 90px; background: var(--panel); border-radius: 12px; position: relative; overflow: hidden; }
.musicbig div > i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--accent); opacity: .85; }
.musicbig div > span { position: absolute; left: 10px; top: 8px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
.musicbig div > b { position: absolute; left: 10px; bottom: 8px; font-size: 13px; mix-blend-mode: difference; }
.presetgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.presetgrid button { height: 56px; display: flex; align-items: center; gap: 10px; text-align: left; font-size: 14px; }
.presetgrid span { font-size: 20px; width: 26px; text-align: center; }
.presetgrid b { font-weight: 600; }
#lineBtn.on { border-color: #fff; background: rgba(255,255,255,.15); }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><img src="/logo-star.png" alt="">LIGHT<b>LINK</b></div>
    <span class="dot" id="dot"></span>
    <button class="bo" id="bo">BLACKOUT</button>
  </header>

  <div class="lightbar">
    <div class="lighthead"><span data-t="light"></span><b id="eff">0%</b></div>
    <div class="hfader" id="hf"><div class="fill" id="hfFill"></div><div class="dz" id="hfDanger"><i>👁</i></div><div class="cap" id="hfCap" hidden></div><div class="knob" id="hfKnob"></div></div>
    <p class="dangernote" id="dangerNote"></p>
  </div>

  <main>
    <section class="page" id="p-live">
      <div class="mlive"><canvas id="mpv"></canvas><span class="mlab">LIVE</span><span class="mpvinfo" id="mpvinfo"></span></div>
      <div class="seg mtools"><button id="mMove" data-t="move"></button><button id="mZone" data-t="zoneEdit"></button><button id="mZoneLaser" data-t="zoneLaser"></button><button id="mCenter" data-t="center"></button></div>
      <div class="vb" data-k="size" data-min="15" data-max="100"><span class="vb-l" data-t="size"></span><span class="vb-v"></span><div class="vb-bar"><div class="vb-fill"></div><div class="vb-knob"></div></div></div>
      <div class="vb zonebar" data-k="zone" data-min="0" data-max="90"><span class="vb-l" data-t="zone"></span><span class="vb-v"></span><div class="vb-bar"><div class="vb-fill"></div><div class="vb-knob"></div></div></div>
      <p class="hint" data-t="liveHint"></p>
      <button class="wide calbtn" id="mCalBtn" data-t="cal"></button>
      <div id="mCal" hidden>
        <div class="seg calsteps" id="mCalSteps"><button data-s="1">1 ↖</button><button data-s="2">2 ↗</button><button data-s="3">3 ↘</button><button data-s="4">4 ↙</button></div>
        <p class="hint" id="mCalInstr"></p>
        <div class="vb" data-k="calx" data-min="-100" data-max="100"><span class="vb-l" id="mCalPosLbl"></span><span class="vb-v"></span><div class="vb-bar"><div class="vb-fill"></div><div class="vb-knob"></div></div></div>
        <div class="vb" data-k="caly" data-min="-100" data-max="100"><span class="vb-l" id="mCalLenLbl"></span><span class="vb-v"></span><div class="vb-bar"><div class="vb-fill"></div><div class="vb-knob"></div></div></div>
        <div class="seg calrow"><button id="mCalDone" data-t="calDone"></button><button id="mCalBox" data-t="calBox"></button><button id="mCalCenter" data-t="calCenter"></button></div>
        <div class="seg calrow"><button id="mCalIx" data-t="invX"></button><button id="mCalIy" data-t="invY"></button><button id="mCalReset" data-t="calReset"></button></div>
      </div>

    </section>

    <section class="page on" id="p-home">
      <div class="home-grid">
        <button class="home-btn" id="hMusic"><i>♪</i><b data-t="hMusic"></b><small id="hMusicState"></small></button>
        <button class="home-btn" id="hRandom"><i>🎲</i><b data-t="hRandom"></b><small data-t="hRandomS"></small></button>
      </div>
      <h2 data-t="hScenes"></h2>
      <div class="scenes" id="homeScenes"></div>
      <h2 data-t="presets"></h2>
      <div class="presetgrid" id="homePresets"></div>
    </section>

    <section class="page" id="p-pat">
      <div class="pages" id="pages"></div>
      <div class="grid4" id="pats"></div>
    </section>

    <section class="page" id="p-look">
      <div class="row" style="margin-top:0"><button class="toggle" id="lineBtn" data-t="line"></button></div>
      <h2 data-t="color"></h2>
      <div class="sw" id="sw"></div>
      <div class="row"><button class="toggle" id="cycle" data-t="cycle"></button></div>
      <h2 data-t="move"></h2>
      <div class="seg" id="moves"></div>
      <label class="sl"><span data-t="size"></span><input type="range" id="size" min="5" max="100"><output></output></label>
      <label class="sl"><span data-t="rot"></span><input type="range" id="rotSpeed" min="-100" max="100"><output></output></label>
      <label class="sl"><span data-t="speed"></span><input type="range" id="moveSpeed" min="0" max="100"><output></output></label>
      <label class="sl"><span data-t="pulse"></span><input type="range" id="pulse" min="0" max="100"><output></output></label>
      <label class="sl"><span data-t="strobe"></span><input type="range" id="strobe" min="0" max="100"><output></output></label>
      <div class="row"><button class="toggle" id="reset" data-t="reset"></button></div>
    </section>

    <section class="page" id="p-music">
      <div class="musicbig" id="musicbig"><div><span data-t="bass"></span><i id="mB"></i></div><div><span data-t="mid"></span><i id="mM"></i></div><div><span data-t="hi"></span><i id="mH"></i></div></div>
      <p class="hint" data-t="smart"></p>
      <div class="seg autos" id="autos"></div>
      <div class="info" id="laserInfo" hidden data-t="laserInfo"></div>

    </section>

    <section class="page" id="p-scenes">
      <div class="scenes" id="scenes"></div>
    </section>
  </main>

  <nav id="nav">
    <button data-p="p-home" class="on"><i>⌂</i><span data-t="nHome"></span></button>
    <button data-p="p-live"><i>◉</i><span data-t="nLive"></span></button>
    <button data-p="p-pat"><i>✦</i><span data-t="nPat"></span></button>
    <button data-p="p-look"><i>◐</i><span data-t="nLook"></span></button>
    <button data-p="p-music"><i>♪</i><span data-t="nMusic"></span></button>
    <button data-p="p-scenes"><i>▦</i><span data-t="nScenes"></span></button>
  </nav>
</div>

<div class="overlay arm" id="armOv" hidden><div class="armbox">
  <h2 data-t="armT"></h2><p data-t="armP"></p>
  <label class="armchk"><input type="checkbox" id="armChk"> <span data-t="armC"></span></label>
  <div class="armrow"><button id="armNo" data-t="cancel"></button><button id="armGo" class="go" disabled data-t="armGo"></button></div>
</div></div>
<div class="overlay" id="ov" hidden><div><h2 id="ovT"></h2><p id="ovP"></p></div></div>

<script>
'use strict';
const L = {
  da: { light: 'Lys', color: 'Farve', cycle: 'Farveskift', move: 'Bevægelse', size: 'Størrelse', rot: 'Rotation', speed: 'Fart', pulse: 'Puls på beat', strobe: 'Strobe',
    reset: 'Nulstil bevægelse', nPat: 'Mønstre', nLook: 'Look', nMusic: 'Musik', nScenes: 'Scener', off: 'Fra', mic: 'Auto (Mac-mik)', laser: 'Auto (laser-mik)',

$('#hMusic').onclick = () => send({ type: 'auto', mode: S && S.auto === 'mic' ? 'off' : 'mic' });
$('#hRandom').onclick = () => send({ type: 'random' });
function renderHome() {
  const hs = $('#homeScenes'); if (hs.dataset.k !== S.scenes.join('|')) { hs.dataset.k = S.scenes.join('|'); hs.innerHTML = '';
    S.scenes.forEach((name, i) => { if (!name) return; const b = document.createElement('button'); b.textContent = name; b.onclick = () => send({ type: 'scene', i }); hs.appendChild(b); });
    if (!hs.childElementCount) { const e = document.createElement('p'); e.className = 'hint'; e.textContent = tt('empty'); hs.appendChild(e); } }
  $$('#homeScenes button').forEach((b, i) => b.classList.toggle('on', S.scenes.filter(Boolean)[i] === S.scenes[S.activeScene]));
  const hp = $('#homePresets'); const pk = (S.presets || []).map((p) => p.join()).join('|');
  if (hp.dataset.k !== pk) { hp.dataset.k = pk; hp.innerHTML = ''; (S.presets || []).slice(0, 8).forEach(([ic, name], i) => { const b = document.createElement('button'); b.innerHTML = '<span></span><b></b>'; b.firstChild.textContent = ic; b.lastChild.textContent = name; b.onclick = () => send({ type: 'preset', i }); hp.appendChild(b); }); }
  $('#hMusic').classList.toggle('on', S.auto === 'mic');
  $('#hMusicState').textContent = tt({ off: 'stOff', mic: 'stMic', laser: 'stLaser', bpm: 'stBpm' }[S.auto] || 'stOff');
  if (S.music) { $('#mB').style.height = S.music.b * 100 + '%'; $('#mM').style.height = S.music.m * 100 + '%'; $('#mH').style.height = S.music.h * 100 + '%'; }
}

// ---- navigation ----
$$('#nav button').forEach((b) => (b.onclick = () => {
  $$('#nav button').forEach((x) => x.classList.toggle('on', x === b));
  $$('.page').forEach((p) => p.classList.toggle('on', p.id === b.dataset.p));
}));

// ---- mønstre ----
const PAGE = 24; let page = 0, patKey = '';
const patData = new Map();
async function loadPat(n) {
  if (patData.has(n)) return patData.get(n);
  patData.set(n, null);
  try { const r = await fetch(q('/pat/' + n)); if (!r.ok) return null; const fr = parseIlda(await r.arrayBuffer()); patData.set(n, fr); return fr; } catch (_) { return null; }
}
async function thumb(tile, n) {
  const fr = await loadPat(n); if (!fr || !fr.length) return;
  let cv = tile.querySelector('canvas'); if (!cv) { cv = document.createElement('canvas'); tile.prepend(cv); tile.classList.add('has'); }
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawIlda(g, W, H, firstVisible(fr), { glow: 1.1 });
}
function renderPats() {
  const avail = new Set(S.patAvail), favs = S.favs || [];
  const pages = Math.max(1, Math.ceil(S.patCount / PAGE));
  const pg = $('#pages'); pg.innerHTML = '';
  { const b = document.createElement('button'); b.textContent = tt('presets'); b.className = page === 'presets' ? 'on' : ''; b.onclick = () => { page = 'presets'; patKey = ''; render(); }; pg.appendChild(b); }
  for (let p = 0; p < pages; p++) { const b = document.createElement('button'); b.textContent = `${p * PAGE + 1}–${Math.min(S.patCount, p * PAGE + PAGE)}`; b.className = p === page ? 'on' : ''; b.onclick = () => { page = p; patKey = ''; render(); }; pg.appendChild(b); }
  if (favs.length) { const b = document.createElement('button'); b.textContent = '★'; b.className = page === -1 ? 'on' : ''; b.onclick = () => { page = -1; patKey = ''; render(); }; pg.appendChild(b); }
  if (page === 'presets') {
    const g = $('#pats'); g.innerHTML = ''; g.className = 'presetgrid';
    (S.presets || []).forEach(([ic, name], i) => { const b = document.createElement('button'); b.innerHTML = '<span></span><b></b>'; b.firstChild.textContent = ic; b.lastChild.textContent = name; b.onclick = () => send({ type: 'preset', i }); g.appendChild(b); });
    return;
  }
  $('#pats').className = 'grid4';
  const list = page === -1 ? favs.slice().sort((a, b) => a - b) : Array.from({ length: Math.min(PAGE, S.patCount - page * PAGE) }, (_, i) => page * PAGE + i + 1);
  const g = $('#pats'); g.innerHTML = '';
  for (const n of list) {
    const d = document.createElement('div'); d.className = 'pat'; d.dataset.n = n;
    d.innerHTML = `<span class="n">${n}</span><span class="nm"></span>`;
    d.querySelector('.nm').textContent = (S.patNames && S.patNames[n]) || '';
    d.onclick = () => send({ type: 'pattern', n });
    g.appendChild(d);
    if (avail.has(n)) requestAnimationFrame(() => thumb(d, n));
  }
}

// ---- tegn tilstand ----
function render(force) {
  if (!S) return;
  if (S.lang && S.lang !== lang) { lang = S.lang; applyLang(); return; }
  if (touching !== 'master') drawFader(S.master);
  $('#hfCap').hidden = !(S.cap < 1); $('#hfCap').style.left = '100%';
  $('#bo').classList.toggle('on', S.blackout); $('#bo').textContent = tt(S.blackout ? 'boOn' : 'bo');
  const key = [page, (S.presets || []).length, S.lang, S.patCount, S.patAvail.length, JSON.stringify(S.patNames), (S.favs || []).join()].join('|');
  if (force || key !== patKey) { patKey = key; renderPats(); }
  $$('.pat').forEach((p) => p.classList.toggle('on', +p.dataset.n === S.pattern));
  $$('#sw button').forEach((b, i) => { const s = SW[i]; b.classList.toggle('on', !S.colorCycle && (s.mode === 'orig' ? S.color.mode === 'orig' : S.color.mode === 'rgb' && String(s.rgb) === String(S.color.rgb))); });
  $('#cycle').classList.toggle('on', S.colorCycle);
  $('#lineBtn').classList.toggle('on', S.special === 'line');
  $$('#moves button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.move));
  $$('#autos button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.auto));
  $('#laserInfo').hidden = S.auto !== 'laser';
  for (const id in SLD) { if (touching === id) continue; const el = $('#' + id); el.value = Math.round(S[id] * SLD[id][0]); el.parentElement.querySelector('output').textContent = SLD[id][1](+el.value); }
  const sc = $('#scenes');
  if (sc.childElementCount !== S.scenes.length || force || sc.dataset.k !== S.scenes.join('|')) {
    sc.dataset.k = S.scenes.join('|'); sc.innerHTML = '';
    S.scenes.forEach((name, i) => { const b = document.createElement('button'); b.textContent = name || `${i + 1}`; b.className = name ? '' : 'empty'; b.onclick = () => name && send({ type: 'scene', i }); sc.appendChild(b); });
  }
  $$('#scenes button').forEach((b, i) => b.classList.toggle('on', i === S.activeScene));
  renderHome();
}

// ---- forbindelse ----
function overlay(tk, pk) { $('#ov').hidden = !tk; if (tk) { $('#ovT').textContent = tt(tk); $('#ovP').textContent = tt(pk); } }
function connect() {
  if (!K) { overlay('noKey', 'noKeyP'); return; }
  const es = new EventSource(q('/events'));
  let alive = false;
  es.onopen = () => { alive = true; $('#dot').classList.add('ok'); overlay(null); };
  es.onmessage = (e) => { try { const d = JSON.parse(e.data); if (d && d.scenes) { S = d; render(); } } catch (_) {} };
  es.onerror = () => {
    $('#dot').classList.remove('ok');
    fetch(q('/patlist')).then((r) => { if (r.status === 403) { es.close(); overlay('noKey', 'noKeyP'); } else if (!alive) overlay('lost', 'lostP'); }).catch(() => overlay('lost', 'lostP'));
  };
}
applyLang();
connect();
</script>
